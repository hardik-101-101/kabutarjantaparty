    <title>KABUTARJANTAPARTY</title>
    <style>
      /* Critical CSS - prevent FOUC */
      html, body { background: #0a0a0f; color: #ffffff; }
      #root { min-height: 100vh; }
      .loading-screen {
        position: fixed; inset: 0; background: #0a0a0f;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.5s ease;
      }
      .loading-screen.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loading-screen" class="loading-screen">
      <div style="text-align:center;">
        <div style="font-family:monospace;font-size:14px;color:#39ff14;margin-bottom:12px;">LOADING_KABUTARJANTAPARTY.exe</div>
        <div style="width:200px;height:2px;background:#1a1a2e;border-radius:2px;overflow:hidden;">
          <div id="loading-bar" style="width:0%;height:100%;background:#39ff14;transition:width 0.3s ease;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Progressive loading bar
      let progress = 0;
      const bar = document.getElementById('loading-bar');
      const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) { progress = 100; clearInterval(interval); }
        bar.style.width = progress + '%';
      }, 100);
    </script>
  </body>
